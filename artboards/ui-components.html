<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="artboard" content="1280x800, x=2720, y=0">
  <title>设计窗口 · 组件面板</title>
  <style>
    :root {
      --chrome: #1e1e1e;
      --canvas: #383838;
      --line: rgba(255, 255, 255, 0.07);
      --text: #e8e8e8;
      --text-2: #9d9d9d;
      --text-3: #6a6a6a;
      --field: #2e2e2e;
      --accent: #4b9eff;
      --accent-soft: rgba(75, 158, 255, 0.16);
      --board-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
      --radius: 4px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1280px; height: 800px;
      display: grid;
      grid-template-rows: 44px 1fr;
      grid-template-columns: 44px 256px 1fr 264px;
      grid-template-areas:
        "titlebar titlebar titlebar titlebar"
        "tools nav canvas inspector";
      background: var(--canvas);
      font-family: -apple-system, "PingFang SC", sans-serif;
      font-size: 12px;
      color: var(--text);
      user-select: none;
      overflow: hidden;
    }

    /* ── 标题栏 ── */
    .titlebar {
      grid-area: titlebar;
      display: flex; align-items: center;
      background: var(--chrome);
      border-bottom: 1px solid var(--line);
      padding: 0 12px 0 10px;
    }
    .titlebar__logo { display: flex; align-items: center; margin: 0 12px 0 2px; }
    .titlebar__logo i { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #4b9eff, #7a5cff); }
    .menus { display: flex; }
    .menus__item { padding: 4px 9px; border-radius: var(--radius); font-size: 12px; color: var(--text-2); }
    .titlebar__spacer { flex: 1; }
    .titlebar__doc { font-size: 12px; font-weight: 600; color: var(--text); }
    .zoom {
      display: flex; align-items: center; gap: 2px;
      height: 26px; padding: 0 2px;
      border-radius: var(--radius);
      font-size: 12px; color: var(--text-2);
      margin-right: 8px; margin-left: auto;
    }
    .zoom__btn { width: 22px; height: 24px; display: grid; place-items: center; border-radius: 4px; color: var(--text-2); font-size: 13px; }
    .zoom__value { width: 30px; height: 24px; display: flex; align-items: center; justify-content: flex-end; padding: 0 2px; font-size: 12px; color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
    .zoom__unit { font-size: 12px; color: var(--text-2); margin-right: 2px; }
    .winctl { display: flex; align-items: center; gap: 2px; margin-left: 10px; }
    .winctl__btn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--radius); color: var(--text-2); }
    .winctl__btn svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── 工具列：第二个面板图标激活 ── */
    .tools {
      grid-area: tools;
      background: var(--chrome);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column; align-items: center;
      gap: 4px;
      padding-top: 10px;
    }
    .tools__btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--radius); color: var(--text-2); }
    .tools__btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .tools__btn--active { background: var(--accent); color: #fff; }
    .tools__spacer { flex: 1; }
    .tools__panels { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-top: 1px solid var(--line); }
    .tools__panel { width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--radius); color: var(--text-2); }
    .tools__panel svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; }
    .tools__panel:first-child svg { fill: currentColor; stroke: none; }
    .tools__panel--active { background: var(--accent-soft); color: var(--accent); }

    /* ── 组件面板 ── */
    .nav {
      grid-area: nav;
      background: var(--chrome);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .nav__search {
      margin: 10px 12px;
      height: 28px;
      display: flex; align-items: center; gap: 7px;
      padding: 0 9px;
      background: var(--field);
      border-radius: var(--radius);
      font-size: 11px; color: var(--text-3);
      flex-shrink: 0;
    }
    .nav__section {
      padding: 10px 14px 8px;
      font-size: 10px; letter-spacing: 1px;
      color: var(--text-3);
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .nav__scroll { flex: 1; overflow-y: auto; padding-bottom: 14px; }

    /* 组件卡：真实渲染的迷你预览 + 名称 + 来源 */
    .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px; }
    .ccard { min-width: 0; }
    .ccard__tile {
      height: 62px;
      border-radius: 7px;
      background: #f4f4f1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 5px;
      margin-bottom: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .ccard__tile--active { outline: 1.5px solid var(--accent); }
    .ccard__name { font-size: 11px; color: var(--text-2); }
    .ccard--active .ccard__name { color: var(--accent); font-weight: 600; }
    .ccard__src { font-size: 9px; color: var(--text-3); margin-top: 1px; }

    /* 迷你组件实例（按极简规范着色） */
    .m-btn {
      height: 20px; padding: 0 11px;
      display: inline-flex; align-items: center;
      background: #111; color: #f4f4f1;
      border-radius: 5px; font-size: 9px; font-weight: 600;
    }
    .m-btn--ghost { background: none; color: #111; border: 1px solid #c9c9c2; }
    .m-input {
      width: 70%; height: 18px;
      background: #fff; border: 1px solid #d8d8d0;
      border-radius: 4px;
    }
    .m-badge {
      padding: 2px 7px;
      background: #111; color: #f4f4f1;
      border-radius: 8px; font-size: 8px; font-weight: 600;
      letter-spacing: 0.04em;
    }
    .m-nav { width: 78%; height: 22px; background: #fff; border: 1px solid #d8d8d0; border-radius: 4px; display: flex; align-items: center; padding: 0 7px; gap: 4px; }
    .m-nav i { width: 5px; height: 5px; border-radius: 50%; background: #111; }
    .m-nav s { flex: 1; height: 4px; border-radius: 2px; background: #e4e4dc; text-decoration: none; }
    .m-listitem { width: 80%; display: flex; align-items: center; gap: 5px; }
    .m-listitem i { width: 14px; height: 14px; border-radius: 50%; background: #d9d9d1; flex-shrink: 0; }
    .m-listitem div { flex: 1; display: grid; gap: 3px; }
    .m-listitem s { height: 4px; border-radius: 2px; background: #cfcfc7; text-decoration: none; }
    .m-listitem s:last-child { width: 60%; background: #e0e0d8; }
    .m-card { width: 70%; height: 38px; background: #fff; border: 1px solid #d8d8d0; border-radius: 6px; padding: 6px; display: grid; gap: 4px; }
    .m-card s { height: 4px; border-radius: 2px; background: #e0e0d8; text-decoration: none; }
    .m-card s:first-child { width: 55%; background: #c9c9c1; }

    /* ── 画布 ── */
    .canvas { grid-area: canvas; position: relative; overflow: hidden; }
    .board { position: absolute; background: #fff; box-shadow: var(--board-shadow); border-radius: 2px; }
    .board__label { position: absolute; top: -19px; left: 0; font-size: 11px; color: var(--text-2); }
    .board__label b { color: var(--text); font-weight: 600; }
    .board--selected { outline: 1.5px solid var(--accent); }
    .board--selected .board__label b { color: var(--accent); }

    .demo-home { width: 320px; height: 640px; left: 60px; top: 64px; }
    .dh__head { height: 42px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #eef0f3; }
    .dh__title { font-size: 13px; font-weight: 700; color: #1c1c22; }
    .dh__hero { height: 160px; background: #111111; }
    .dh__body { padding: 14px 16px; display: grid; gap: 11px; }
    .dh__banner { height: 150px; border-radius: 10px; background: #f4f4f1; }
    .sk { height: 11px; border-radius: 5px; background: #eef1f5; }
    .sk--w60 { width: 60%; }
    .dh__card { display: flex; gap: 10px; align-items: center; }
    .dh__avatar { width: 34px; height: 34px; border-radius: 50%; background: #e3e8ef; flex-shrink: 0; }
    .dh__lines { flex: 1; display: grid; gap: 6px; }

    .demo-login { width: 190px; height: 380px; left: 424px; top: 296px; display: flex; flex-direction: column; align-items: center; padding: 32px 20px; }
    .dl__logo { width: 42px; height: 42px; border-radius: 11px; background: #111111; }
    .dl__title { margin-top: 14px; font-size: 14px; font-weight: 700; color: #1a1a1a; }
    .dl__sub { margin-top: 5px; font-size: 10px; color: #9aa3ad; text-align: center; }
    .dl__field { width: 100%; height: 30px; margin-top: 18px; border: 1px solid #e2e6ea; border-radius: 6px; }
    .dl__btn { width: 100%; height: 32px; margin-top: 11px; border-radius: 6px; background: #111111; }

    /* ── 检查器 ── */
    .inspector {
      grid-area: inspector;
      background: var(--chrome);
      border-left: 1px solid var(--line);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .inspector__section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .inspector__title { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .inspector__state { display: flex; align-items: center; gap: 5px; letter-spacing: 0; font-size: 10px; color: var(--text-2); text-transform: none; }
    .inspector__state i { width: 6px; height: 6px; border-radius: 50%; background: #28c840; }
    .fieldrow { display: flex; align-items: center; gap: 8px; height: 30px; margin-bottom: 6px; }
    .fieldrow__label { width: 30px; flex-shrink: 0; color: var(--text-2); }
    .fieldrow__input { flex: 1; height: 28px; display: flex; align-items: center; padding: 0 9px; background: var(--field); border: 1px solid var(--line); border-radius: var(--radius); font-size: 12px; color: var(--text); }
    .log { display: grid; gap: 8px; }
    .log__item { display: flex; gap: 8px; align-items: baseline; font-size: 11px; }
    .log__time { color: var(--text-3); flex-shrink: 0; font-family: "SF Mono", Menlo, monospace; font-size: 10px; }
    .log__text { color: var(--text-2); }
    .log__text b { color: var(--text); font-weight: 600; }
    .inspector__spacer { flex: 1; }
    .inspector__footer { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
    .input { flex: 1; height: 30px; display: flex; align-items: center; padding: 0 10px; background: var(--field); border: 1px solid var(--line); border-radius: var(--radius); font-size: 11px; color: var(--text-3); }
    .send { width: 30px; height: 30px; flex-shrink: 0; display: grid; place-items: center; background: var(--accent); border-radius: var(--radius); }
    .send svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 1.6; }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="titlebar__logo"><i></i></div>
    <nav class="menus">
      <div class="menus__item">文件</div>
      <div class="menus__item">编辑</div>
      <div class="menus__item">视图</div>
      <div class="menus__item">画板</div>
      <div class="menus__item">Agent</div>
      <div class="menus__item">帮助</div>
    </nav>
    <div class="titlebar__spacer"></div>
    <div class="titlebar__doc">示例项目</div>
    <div class="zoom">
      <div class="zoom__btn">−</div>
      <div class="zoom__value">100</div>
      <span class="zoom__unit">%</span>
      <div class="zoom__btn">＋</div>
    </div>
    <div class="winctl">
      <div class="winctl__btn"><svg viewBox="0 0 11 11"><path d="M1 5.5h9"/></svg></div>
      <div class="winctl__btn"><svg viewBox="0 0 11 11"><rect x="1.5" y="1.5" width="8" height="8" rx="1"/></svg></div>
      <div class="winctl__btn"><svg viewBox="0 0 11 11"><path d="M1.5 1.5l8 8M9.5 1.5l-8 8"/></svg></div>
    </div>
  </header>

  <!-- 工具列：组件面板图标激活 -->
  <nav class="tools">
    <div class="tools__btn tools__btn--active"><svg viewBox="0 0 16 16"><path d="M4 2 L13 8.5 L8.8 9.4 L6.5 13.5 Z"/></svg></div>
    <div class="tools__btn"><svg viewBox="0 0 16 16"><path d="M5 7V3.8a1 1 0 0 1 2 0V7m0-2.5a1 1 0 0 1 2 0V7m0-1.5a1 1 0 0 1 2 0V8m0-.5a1 1 0 0 1 2 0v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a1 1 0 0 1 1-1z"/></svg></div>
    <div class="tools__btn"><svg viewBox="0 0 16 16"><path d="M11.1 2.3a1.9 1.9 0 0 1 2.6 2.6L5 13.6 2 14l.4-3z"/></svg></div>
    <div class="tools__spacer"></div>
    <div class="tools__panels">
      <div class="tools__panel" title="设计面板"><svg viewBox="0 0 16 16"><path d="M2 5V3.5A1.5 1.5 0 0 1 3.5 2H5M11 2h1.5A1.5 1.5 0 0 1 14 3.5V5M14 11v1.5a1.5 1.5 0 0 1-1.5 1.5H11M5 14H3.5A1.5 1.5 0 0 1 2 12.5V11"/><circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"/></svg></div>
      <div class="tools__panel tools__panel--active" title="组件面板"><svg viewBox="0 0 16 16"><path d="M8 1.8 L10.5 5 L8 8.2 L5.5 5 Z M4.5 7 L7 10.2 L4.5 13.4 L2 10.2 Z M11.5 7 L14 10.2 L11.5 13.4 L9 10.2 Z"/></svg></div>
      <div class="tools__panel" title="风格面板"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5.2" height="5.2" rx="1.4"/><rect x="8.8" y="2" width="5.2" height="5.2" rx="1.4" fill="currentColor" stroke="none"/><rect x="2" y="8.8" width="5.2" height="5.2" rx="1.4"/><rect x="8.8" y="8.8" width="5.2" height="5.2" rx="1.4"/></svg></div>
    </div>
  </nav>

  <!-- 组件面板：从画板抽离的真实组件，网格预览 + 来源 -->
  <aside class="nav">
    <div class="nav__search">搜索组件</div>
    <div class="nav__scroll">
      <div class="nav__section"><span>控件</span><span>4</span></div>
      <div class="cgrid">
        <div class="ccard ccard--active">
          <div class="ccard__tile ccard__tile--active"><span class="m-btn">按钮文字</span></div>
          <div class="ccard__name">按钮 / 主要</div>
          <div class="ccard__src">来自 首页</div>
        </div>
        <div class="ccard">
          <div class="ccard__tile"><span class="m-btn m-btn--ghost">按钮文字</span></div>
          <div class="ccard__name">按钮 / 次要</div>
          <div class="ccard__src">来自 设置</div>
        </div>
        <div class="ccard">
          <div class="ccard__tile"><span class="m-input"></span></div>
          <div class="ccard__name">输入框</div>
          <div class="ccard__src">来自 登录</div>
        </div>
        <div class="ccard">
          <div class="ccard__tile"><span class="m-badge">NEW</span></div>
          <div class="ccard__name">徽标</div>
          <div class="ccard__src">来自 首页</div>
        </div>
      </div>

      <div class="nav__section"><span>内容</span><span>3</span></div>
      <div class="cgrid">
        <div class="ccard">
          <div class="ccard__tile"><span class="m-nav"><i></i><s></s></span></div>
          <div class="ccard__name">顶部导航</div>
          <div class="ccard__src">来自 首页</div>
        </div>
        <div class="ccard">
          <div class="ccard__tile"><span class="m-listitem"><i></i><div><s></s><s></s></div></span></div>
          <div class="ccard__name">列表项</div>
          <div class="ccard__src">来自 首页</div>
        </div>
        <div class="ccard">
          <div class="ccard__tile"><span class="m-card"><s></s><s></s><s></s></span></div>
          <div class="ccard__name">内容卡片</div>
          <div class="ccard__src">来自 仪表盘</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 画布 -->
  <main class="canvas">
    <div class="board demo-home board--selected">
      <div class="board__label"><b>首页</b></div>
      <div class="dh__head"><span class="dh__title">首页</span></div>
      <div class="dh__hero"></div>
      <div class="dh__body">
        <div class="sk sk--w60"></div>
        <div class="dh__card"><div class="dh__avatar"></div><div class="dh__lines"><div class="sk"></div><div class="sk sk--w60"></div></div></div>
        <div class="dh__card"><div class="dh__avatar"></div><div class="dh__lines"><div class="sk"></div><div class="sk sk--w60"></div></div></div>
        <div class="dh__banner"></div>
        <div class="sk sk--w60"></div>
        <div class="dh__card"><div class="dh__avatar"></div><div class="dh__lines"><div class="sk"></div><div class="sk sk--w60"></div></div></div>
      </div>
    </div>
    <div class="board demo-login">
      <div class="board__label"><b>登录</b></div>
      <div class="dl__logo"></div>
      <div class="dl__title">登录 MLCanvas</div>
      <div class="dl__sub">极简风格下的登录页</div>
      <div class="dl__field"></div>
      <div class="dl__field"></div>
      <div class="dl__btn"></div>
    </div>
  </main>

  <!-- 检查器：选中「按钮 / 主要」组件 → 检查器给组件信息 + 使用处 -->
  <aside class="inspector">
    <div class="inspector__section">
      <div class="inspector__title">组件</div>
      <div class="fieldrow">
        <span class="fieldrow__label">名称</span>
        <div class="fieldrow__input">按钮 / 主要</div>
      </div>
      <div class="fieldrow">
        <span class="fieldrow__label">来源</span>
        <div class="fieldrow__input">首页</div>
      </div>
    </div>
    <div class="inspector__section">
      <div class="inspector__title"><span>Agent 协作</span><span class="inspector__state"><i></i>ZCode 可用</span></div>
      <div class="log">
        <div class="log__item"><span class="log__time">14:36</span><span class="log__text">从<b>「首页」</b>抽离了组件<b>「顶部导航」</b></span></div>
        <div class="log__item"><span class="log__time">14:35</span><span class="log__text">更新了<b>「风格规范」</b></span></div>
        <div class="log__item"><span class="log__time">14:34</span><span class="log__text">更新了<b>「首页」</b></span></div>
      </div>
    </div>
    <div class="inspector__spacer"></div>
    <div class="inspector__footer">
      <div class="input">给 Agent 写张便签…</div>
      <div class="send"><svg viewBox="0 0 13 13"><path d="M1.5 6.5 L11.5 1.5 L8 11.5 L5.5 7z"/></svg></div>
    </div>
  </aside>
</body>
</html>
