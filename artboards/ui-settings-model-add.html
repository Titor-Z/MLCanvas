<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="artboard" content="960x640, x=11560, y=0">
  <title>全局设置 · 添加模型配置</title>
  <style>
    :root {
      --chrome: #1e1e1e;
      --bg: #262626;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8e8e8;
      --text-2: #9d9d9d;
      --text-3: #6a6a6a;
      --field: #2e2e2e;
      --accent: #4b9eff;
      --accent-soft: rgba(75, 158, 255, 0.14);
      --ok: #34c759;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 960px; height: 640px;
      background: var(--bg);
      font-family: -apple-system, "PingFang SC", sans-serif;
      font-size: 12px;
      color: var(--text);
      user-select: none;
      overflow: hidden;
      position: relative;
    }
    .home { position: absolute; inset: 0; }
    .home__titlebar { height: 44px; background: var(--chrome); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 8px 0 12px; }
    .home__logo { display: flex; align-items: center; gap: 1px; font-size: 13px; font-weight: 700; }
    .home__logo .yu { font-size: 17px; font-weight: 600; background: linear-gradient(135deg, #4b9eff, #7a5cff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); }

    .dialog {
      position: absolute; top: 50px; left: 50%;
      transform: translateX(-50%);
      width: 720px; height: 528px;
      background: var(--chrome);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .dialog__head {
      height: 46px; flex-shrink: 0;
      display: flex; align-items: center;
      padding: 0 12px 0 20px;
      border-bottom: 1px solid var(--line);
    }
    .dialog__title { font-size: 13px; font-weight: 700; letter-spacing: 0.01em; }
    .dialog__close { margin-left: auto; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; color: var(--text-3); }
    .dialog__close svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
    .dialog__body { flex: 1; min-height: 0; display: grid; grid-template-columns: 148px 1fr; }

    .nav { border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 1px; }
    .nav__item { height: 30px; padding: 0 10px; display: flex; align-items: center; border-radius: 6px; font-size: 12.5px; color: var(--text-2); letter-spacing: 0.01em; }
    .nav__item--active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .nav__spacer { flex: 1; }
    .nav__foot { padding: 6px 10px; font-size: 10.5px; color: var(--text-3); font-family: "SF Mono", Menlo, monospace; }

    .content { display: flex; flex-direction: column; overflow-y: auto; padding: 22px 28px 20px; }
    .formhead { display: flex; align-items: center; padding-bottom: 14px; }
    .formhead b { font-size: 13px; font-weight: 700; }
    .formhead .cancel { margin-left: auto; font-size: 11.5px; color: var(--text-3); }
    .formhead .cancel:hover { color: var(--text); }

    .section { margin-bottom: 20px; }
    .section__label { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
    .row { display: flex; align-items: center; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .section .row:last-child { border-bottom: none; }
    .row__col { flex: 1; min-width: 0; }
    .row__label { font-size: 12.5px; letter-spacing: 0.01em; }
    .row__desc { font-size: 11px; color: var(--text-3); margin-top: 3px; line-height: 1.5; }
    .row__side { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .seg { display: flex; gap: 2px; padding: 2px; background: var(--field); border-radius: 6px; }
    .seg__item { height: 24px; padding: 0 11px; display: flex; align-items: center; border-radius: 4px; font-size: 11.5px; color: var(--text-2); }
    .seg__item--active { background: #3a3a3e; color: var(--text); font-weight: 600; }

    .input {
      height: 27px; padding: 0 10px;
      background: var(--field); border-radius: 6px;
      font-size: 11.5px; color: var(--text);
      display: flex; align-items: center;
      min-width: 0;
    }
    .input--mono { font-family: "SF Mono", Menlo, monospace; font-size: 11px; }
    .input--auto { color: var(--text-2); }
    .input--ph { color: var(--text-3); }

    .modelbtn {
      display: flex; align-items: center; gap: 8px;
      height: 27px; padding: 0 10px;
      background: var(--field); border-radius: 6px;
      font-size: 11.5px;
      min-width: 218px;
    }
    .modelbtn .caret { margin-left: auto; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--text-3); }

    .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
    .test { height: 26px; padding: 0 12px; display: flex; align-items: center; background: var(--field); border-radius: 6px; font-size: 11.5px; }
    .okdot { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ok); }
    .okdot i { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); }
    .foot__spacer { flex: 1; }
    .done { height: 27px; padding: 0 16px; display: flex; align-items: center; background: var(--accent); border-radius: 6px; font-size: 11.5px; font-weight: 600; color: #fff; }
  </style>
</head>
<body>
  <div class="home">
    <div class="home__titlebar">
      <div class="home__logo"><span class="yu">聿</span>Canvas</div>
    </div>
  </div>
  <div class="scrim"></div>

  <div class="dialog">
    <div class="dialog__head">
      <div class="dialog__title">设置</div>
      <div class="dialog__close"><svg viewBox="0 0 10 10"><path d="M1.5 1.5 8.5 8.5M8.5 1.5 1.5 8.5"/></svg></div>
    </div>
    <div class="dialog__body">
      <nav class="nav">
        <div class="nav__item">通用</div>
        <div class="nav__item nav__item--active">模型</div>
        <div class="nav__item">数据</div>
        <div class="nav__item">关于</div>
        <div class="nav__spacer"></div>
        <div class="nav__foot">0.4.0</div>
      </nav>

      <div class="content">
        <div class="formhead">
          <b>添加模型配置</b>
          <span class="cancel">取消</span>
        </div>

        <div class="section">
          <div class="section__label">服务</div>
          <div class="row">
            <div class="row__col">
              <div class="row__label">服务商</div>
              <div class="row__desc">自定义可接任何兼容服务，包括本地模型</div>
            </div>
            <div class="row__side">
              <div class="seg">
                <div class="seg__item seg__item--active">DeepSeek</div>
                <div class="seg__item">智谱 GLM</div>
                <div class="seg__item">Kimi</div>
                <div class="seg__item">自定义</div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="row__col">
              <div class="row__label">接口地址</div>
              <div class="row__desc">选服务商后自动带出，无需手填</div>
            </div>
            <div class="row__side" style="flex: 1; justify-content: flex-end;">
              <div class="input input--mono input--auto" style="width: 100%; max-width: 320px;">https://api.deepseek.com/v1</div>
            </div>
          </div>
          <div class="row">
            <div class="row__col">
              <div class="row__label">密钥</div>
              <div class="row__desc">只存在本机，不会上传</div>
            </div>
            <div class="row__side" style="flex: 1; justify-content: flex-end;">
              <div class="input input--mono input--ph" style="width: 100%; max-width: 320px;">sk-…</div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section__label">模型</div>
          <div class="row">
            <div class="row__col">
              <div class="row__label">模型</div>
              <div class="row__desc">来自公共模型库，实时更新 · 标注上下文长度</div>
            </div>
            <div class="row__side">
              <div class="modelbtn">
                选择模型…
                <span class="caret"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="foot">
          <div class="test">测试连接</div>
          <div class="okdot"><i></i>连接成功</div>
          <div class="foot__spacer"></div>
          <div class="done">完成</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
