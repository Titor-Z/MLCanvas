<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>User Card</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f4f6;
      font-family: -apple-system, "PingFang SC", sans-serif;
    }
    .card {
      width: 280px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }
    .card__banner { height: 72px; background: linear-gradient(120deg, #6c6cf5, #ec4899); }
    .card__body { padding: 0 20px 20px; text-align: center; }
    .card__avatar {
      width: 64px;
      height: 64px;
      margin: -32px auto 12px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: #6c6cf5;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 22px;
      font-weight: 600;
    }
    .card__name { margin: 0 0 4px; font-size: 18px; color: #111827; }
    .card__role { margin: 0 0 16px; font-size: 13px; color: #6b7280; }
    .card__actions { display: flex; gap: 8px; }
    .card__btn {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #d1d5db;
      background: #fff;
      color: #374151;
    }
    .card__btn--primary { background: #6c6cf5; border-color: #6c6cf5; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card__banner"></div>
    <div class="card__body">
      <div class="card__avatar">M</div>
      <h2 class="card__name">MLCanvas</h2>
      <p class="card__role">Agent 优先的 UI 设计观察窗</p>
      <div class="card__actions">
        <button class="card__btn card__btn--primary">关注</button>
        <button class="card__btn">消息</button>
      </div>
    </div>
  </div>
</body>
</html>
