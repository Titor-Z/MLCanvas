<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="artboard" content="960x640">
  <title>MLCanvas · 主页</title>
  <style>
    /* ── 设计 token：字阶四级、间距 4px 网格、单一主题色 ── */
    :root {
      --chrome: #1e1e1e;
      --bg: #232323;
      --card: #2a2a2a;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8e8e8;
      --text-2: #9d9d9d;
      --text-3: #86868b;   /* Apple 暗色次级灰，深底对比 ≈4.5:1 */
      --accent: #4b9eff;
      --accent-soft: rgba(75, 158, 255, 0.14);
      --radius-card: 8px;
      --radius-btn: 6px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 960px; height: 640px;
      display: grid;
      grid-template-rows: 44px 1fr;
      background: var(--bg);
      font-family: -apple-system, "PingFang SC", sans-serif;
      font-size: 13px;
      color: var(--text);
      user-select: none;
      overflow: hidden;
    }

    /* ── 标题栏：Logo · 设置 · Agent · 窗口控制 ── */
    .titlebar {
      grid-area: 1 / 1;
      display: flex; align-items: center;
      background: var(--chrome);
      border-bottom: 1px solid var(--line);
      padding: 0 8px 0 12px;
    }
    .titlebar__logo { display: flex; align-items: center; gap: 8px; }
    .titlebar__logo i {
      width: 18px; height: 18px; border-radius: 5px;
      background: linear-gradient(135deg, #4b9eff, #7a5cff);
    }
    .titlebar__logo span { font-size: 13px; font-weight: 700; }
    .titlebar__spacer { flex: 1; }
    .titlebar__btn {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      border-radius: var(--radius-btn);
      color: var(--text-2);
    }
    .titlebar__btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .titlebar__btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .titlebar__agent {
      display: flex; align-items: center; gap: 7px;
      height: 26px; padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      font-size: 11px; letter-spacing: 0.01em; color: var(--text-2);
      margin: 0 10px 0 8px;
    }
    .titlebar__agent i { width: 6px; height: 6px; border-radius: 50%; background: #28c840; }
    .winctl { display: flex; align-items: center; gap: 2px; }
    .winctl__btn {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      border-radius: var(--radius-btn);
      color: var(--text-2);
    }
    .winctl__btn svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .winctl__btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .winctl__btn--close:hover { background: #e81123; color: #fff; }

    /* ── 主区：内容列 640px 居中 ── */
    .main {
      overflow: hidden;
      padding: 64px 48px 48px;
    }
    .content { max-width: 640px; margin: 0 auto; }

    .hero__title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
    .hero__sub { margin-top: 8px; font-size: 13px; line-height: 1.5; letter-spacing: 0.01em; color: var(--text-2); }

    .section__head {
      margin: 40px 0 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .section__title { font-size: 14px; font-weight: 700; }
    .head__tools { display: flex; align-items: center; gap: 10px; }
    /* 打开项目：区头 ghost 按钮，安静但可发现（低频恢复动作） */
    .headopen {
      height: 28px; padding: 0 12px;
      display: flex; align-items: center; gap: 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius-btn);
      font-size: 12px; color: var(--text-2);
      transition: border-color 160ms ease-out, color 160ms ease-out, transform 100ms ease-out;
    }
    .headopen svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .headopen:hover { border-color: rgba(255, 255, 255, 0.22); color: var(--text); }
    .headopen:active { transform: scale(0.97); }
    .viewtoggle {
      display: flex; gap: 2px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-btn);
      padding: 2px;
    }
    .viewtoggle__btn {
      width: 26px; height: 24px;
      display: grid; place-items: center;
      border-radius: 4px;
      color: var(--text-3);
    }
    .viewtoggle__btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
    .viewtoggle__btn--active { background: var(--accent-soft); color: var(--accent); }

    /* 项目方块：hover 提亮、按下微缩（160ms/100ms ease-out） */
    .recents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .proj__thumb {
      height: 118px;
      border-radius: var(--radius-card);
      border: 1px solid var(--line);
      position: relative; overflow: hidden;
      background: var(--card);
      transition: border-color 160ms ease-out, transform 100ms ease-out;
    }
    .proj:hover .proj__thumb, .proj--hover .proj__thumb { border-color: rgba(255, 255, 255, 0.22); }
    .proj:active .proj__thumb { transform: scale(0.98); }
    .proj__thumb i { position: absolute; inset: 12px; border-radius: 4px; }
    /* 删除：悬停卡片时出现在缩略图右上角 */
    .proj__del {
      position: absolute; top: 8px; right: 8px;
      width: 24px; height: 24px;
      display: grid; place-items: center;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 6px;
      color: var(--text-2);
      opacity: 0;
      transition: opacity 160ms ease-out;
    }
    .proj__del svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
    .proj:hover .proj__del, .proj--hover .proj__del { opacity: 1; }
    .proj__del:hover { color: #ff6b6b; }
    .proj__name { margin-top: 10px; font-size: 13px; font-weight: 600; line-height: 1.3; }
    .proj__time { margin-top: 2px; font-size: 11px; letter-spacing: 0.01em; line-height: 1.3; color: var(--text-3); }

    .proj__new {
      height: 118px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      display: grid; place-items: center;
      transition: border-color 160ms ease-out, transform 100ms ease-out;
    }
    .proj--new:hover .proj__new { border-color: rgba(255, 255, 255, 0.22); }
    .proj--new:active .proj__new { transform: scale(0.98); }
    .proj__new svg { width: 18px; height: 18px; fill: none; stroke: var(--text-2); stroke-width: 1.5; stroke-linecap: round; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
    @media (prefers-contrast: more) {
      :root { --text-2: #c4c4c8; --text-3: #a5a5aa; --line: rgba(255, 255, 255, 0.18); }
    }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="titlebar__logo" data-id="logo"><i></i><span>MLCanvas</span></div>
    <div class="titlebar__spacer"></div>
    <div class="titlebar__btn" data-id="nav-settings" title="设置">
      <svg viewBox="0 0 16 16"><path d="M2 4.5h5.5M10.5 4.5H14M2 11.5h5.5M10.5 11.5H14"/><circle cx="9" cy="4.5" r="1.8"/><circle cx="5.5" cy="11.5" r="1.8"/></svg>
    </div>
    <div class="titlebar__agent" data-id="agent-status"><i></i>ZCode 可用</div>
    <div class="winctl" data-id="winctl">
      <div class="winctl__btn" title="最小化"><svg viewBox="0 0 11 11"><path d="M1 5.5h9"/></svg></div>
      <div class="winctl__btn" title="最大化"><svg viewBox="0 0 11 11"><rect x="1.5" y="1.5" width="8" height="8" rx="1"/></svg></div>
      <div class="winctl__btn winctl__btn--close" title="关闭"><svg viewBox="0 0 11 11"><path d="M1.5 1.5l8 8M9.5 1.5l-8 8"/></svg></div>
    </div>
  </header>

  <main class="main">
    <div class="content">
      <h1 class="hero__title">晚上好。</h1>
      <p class="hero__sub">打开你的 Agent，说出你想要的界面——渲染结果会实时出现在画布上。</p>

      <div class="section__head">
        <span class="section__title">项目</span>
        <div class="head__tools">
          <div class="headopen" data-id="proj-open" title="在磁盘上选择已有的项目文件夹"><svg viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 2h4.5A1.5 1.5 0 0 1 14 6.5v5A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5v-7Z"/></svg>打开</div>
          <div class="viewtoggle" data-id="view-toggle">
            <div class="viewtoggle__btn" title="列表视图"><svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></div>
            <div class="viewtoggle__btn viewtoggle__btn--active" title="方块视图"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="4.6" height="4.6" rx="1"/><rect x="8.9" y="2.5" width="4.6" height="4.6" rx="1"/><rect x="2.5" y="8.9" width="4.6" height="4.6" rx="1"/><rect x="8.9" y="8.9" width="4.6" height="4.6" rx="1"/></svg></div>
          </div>
        </div>
      </div>

      <div class="recents" data-id="recents">
        <div class="proj proj--new" data-id="proj-new">
          <div class="proj__new"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></div>
          <div class="proj__name">新建项目</div>
        </div>
        <div class="proj proj--hover" data-id="proj-1">
          <div class="proj__thumb"><i style="background:linear-gradient(135deg,#4b9eff,#7a5cff)"></i><div class="proj__del" data-id="proj-del" title="删除项目"><svg viewBox="0 0 16 16"><path d="M3 5h10M6.5 5V3.5h3V5M5 5l.6 8h4.8L11 5"/></svg></div></div>
          <div class="proj__name">示例项目</div>
          <div class="proj__time">今天</div>
        </div>
        <div class="proj" data-id="proj-2">
          <div class="proj__thumb"><i style="background:linear-gradient(135deg,#f5a623,#f76b1c)"></i></div>
          <div class="proj__name">博客改版</div>
          <div class="proj__time">昨天</div>
        </div>
        <div class="proj" data-id="proj-3">
          <div class="proj__thumb"><i style="background:linear-gradient(135deg,#7a5cff,#d946ef)"></i></div>
          <div class="proj__name">活动落地页</div>
          <div class="proj__time">上周</div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
