name: release

# 只在打 tag 时打包（仓库空间有限，不进每次提交）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（如 v0.5.0）
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: --bundles deb,appimage
            rust_targets: ""
          - os: windows-latest
            args: --bundles nsis
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch 从默认分支跑时也要拿到目标 tag 的提交
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # 只装 ayatana 版托盘库：与旧 libappindicator3-dev 互斥（同时装会 unmet dependencies）
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev

      - name: vendor 参考库（skills + design-systems，pinned commit）
        shell: bash
        run: ./dev.sh vendor

      - name: 前端依赖
        working-directory: app
        run: npm ci

      - name: 打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "聿Canvas ${{ inputs.tag || github.ref_name }}"
          # 直接发布：产物出现在 Releases 页，不再留草稿
          releaseDraft: false
          prerelease: false
