<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="artboard" content="960x640, x=9400, y=0">
  <title>全局设置 · 通用（重制）</title>
  <style>
    :root {
      --chrome: #1e1e1e;
      --bg: #262626;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8e8e8;
      --text-2: #9d9d9d;
      --text-3: #6a6a6a;
      --field: #2e2e2e;
      --accent: #4b9eff;
      --accent-soft: rgba(75, 158, 255, 0.14);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 960px; height: 640px;
      background: var(--bg);
      font-family: -apple-system, "PingFang SC", sans-serif;
      font-size: 12px;
      color: var(--text);
      user-select: none;
      overflow: hidden;
      position: relative;
    }
    .home { position: absolute; inset: 0; }
    .home__titlebar { height: 44px; background: var(--chrome); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 8px 0 12px; }
    .home__logo { display: flex; align-items: center; gap: 1px; font-size: 13px; font-weight: 700; }
    .home__logo .yu { font-size: 17px; font-weight: 600; background: linear-gradient(135deg, #4b9eff, #7a5cff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); }

    .dialog {
      position: absolute; top: 50px; left: 50%;
      transform: translateX(-50%);
      width: 720px; height: 528px;
      background: var(--chrome);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .dialog__head {
      height: 46px; flex-shrink: 0;
      display: flex; align-items: center;
      padding: 0 12px 0 20px;
      border-bottom: 1px solid var(--line);
    }
    .dialog__title { font-size: 13px; font-weight: 700; letter-spacing: 0.01em; }
    .dialog__close { margin-left: auto; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; color: var(--text-3); }
    .dialog__close svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
    .dialog__body { flex: 1; min-height: 0; display: grid; grid-template-columns: 148px 1fr; }

    /* 左导航：纯文字，无图标 */
    .nav { border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 1px; }
    .nav__item {
      height: 30px; padding: 0 10px;
      display: flex; align-items: center;
      border-radius: 6px;
      font-size: 12.5px; color: var(--text-2);
      letter-spacing: 0.01em;
    }
    .nav__item:hover { color: var(--text); }
    .nav__item--active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .nav__spacer { flex: 1; }
    .nav__foot { padding: 6px 10px; font-size: 10.5px; color: var(--text-3); font-family: "SF Mono", Menlo, monospace; }

    /* 内容区：平铺行 + 发丝线，无卡片嵌套 */
    .content { overflow-y: auto; padding: 22px 28px; }
    .section { margin-bottom: 26px; }
    .section__label {
      font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 4px;
    }
    .row {
      display: flex; align-items: center; gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }
    .section .row:last-child { border-bottom: none; }
    .row__col { flex: 1; min-width: 0; }
    .row__label { font-size: 12.5px; letter-spacing: 0.01em; }
    .row__desc { font-size: 11px; color: var(--text-3); margin-top: 3px; line-height: 1.5; }
    .row__side { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .seg { display: flex; gap: 2px; padding: 2px; background: var(--field); border-radius: 6px; }
    .seg__item { height: 24px; padding: 0 12px; display: flex; align-items: center; border-radius: 4px; font-size: 11.5px; color: var(--text-2); }
    .seg__item--active { background: #3a3a3e; color: var(--text); font-weight: 600; }
    .seg__item--soon { color: var(--text-3); }

    .path { font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: var(--text-2); }
    .btn {
      height: 25px; padding: 0 11px;
      display: flex; align-items: center;
      background: var(--field);
      border-radius: 6px;
      font-size: 11.5px; color: var(--text);
      transition: transform 100ms ease-out;
    }
    .btn:hover { background: #35353a; }
    .btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="home">
    <div class="home__titlebar">
      <div class="home__logo"><span class="yu">聿</span>Canvas</div>
    </div>
  </div>
  <div class="scrim"></div>

  <div class="dialog">
    <div class="dialog__head">
      <div class="dialog__title">设置</div>
      <div class="dialog__close"><svg viewBox="0 0 10 10"><path d="M1.5 1.5 8.5 8.5M8.5 1.5 1.5 8.5"/></svg></div>
    </div>
    <div class="dialog__body">
      <nav class="nav">
        <div class="nav__item nav__item--active">通用</div>
        <div class="nav__item">模型</div>
        <div class="nav__item">数据</div>
        <div class="nav__item">关于</div>
        <div class="nav__spacer"></div>
        <div class="nav__foot">0.4.0</div>
      </nav>

      <div class="content">
        <div class="section">
          <div class="section__label">外观</div>
          <div class="row">
            <div class="row__col">
              <div class="row__label">界面语言</div>
            </div>
            <div class="row__side">
              <div class="seg">
                <div class="seg__item seg__item--active">简体中文</div>
                <div class="seg__item">English</div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="row__col">
              <div class="row__label">主题</div>
              <div class="row__desc">亮色在准备中</div>
            </div>
            <div class="row__side">
              <div class="seg">
                <div class="seg__item seg__item--active">暗色</div>
                <div class="seg__item seg__item--soon">亮色</div>
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section__label">项目</div>
          <div class="row">
            <div class="row__col">
              <div class="row__label">新建项目默认位置</div>
              <div class="row__desc">新建时可以随时更换目录</div>
            </div>
            <div class="row__side">
              <span class="path">~/YuCanvas</span>
              <div class="btn">更换</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
