<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="artboard" content="720x600, x=8200, y=0">
  <title>接入模型 · 设置弹窗</title>
  <style>
    :root {
      --chrome: #1e1e1e;
      --line: rgba(255, 255, 255, 0.07);
      --text: #e8e8e8;
      --text-2: #9d9d9d;
      --text-3: #6a6a6a;
      --field: #2e2e2e;
      --accent: #4b9eff;
      --accent-soft: rgba(75, 158, 255, 0.16);
      --ok: #34c759;
      --lift: #2a2a2e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720px; height: 600px;
      background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        repeating-linear-gradient(45deg, #333 0 14px, #3a3a3a 14px 28px);
      font-family: -apple-system, "PingFang SC", sans-serif;
      font-size: 12px;
      color: var(--text);
      user-select: none;
      overflow: hidden;
      display: grid; place-items: center;
    }

    .dialog {
      width: 400px;
      background: var(--lift);
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    .dialog__head { display: flex; align-items: center; padding: 15px 18px 0; }
    .dialog__title { font-size: 13px; font-weight: 600; }
    .dialog__close { margin-left: auto; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; color: var(--text-3); }
    .dialog__close svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }

    .dialog__body { padding: 14px 18px 4px; display: flex; flex-direction: column; gap: 13px; }

    .seg { display: flex; gap: 2px; padding: 2px; background: var(--field); border-radius: 7px; }
    .seg__item { flex: 1; height: 26px; display: grid; place-items: center; border-radius: 5px; font-size: 11.5px; color: var(--text-2); }
    .seg__item--active { background: #3c3c40; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field__label { font-size: 11px; color: var(--text-2); }
    .field__input {
      height: 30px; padding: 0 10px;
      background: var(--field); border-radius: 7px;
      font-size: 11.5px; color: var(--text);
      display: flex; align-items: center;
    }
    .field__input--ph { color: var(--text-3); }

    .presets { display: flex; gap: 4px; flex-wrap: wrap; }
    .preset { padding: 3px 7px; border-radius: 20px; background: var(--field); font-size: 10px; color: var(--text-2); cursor: pointer; }
    .preset--active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

    .dialog__foot {
      margin-top: 8px; padding: 12px 18px 16px;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px;
    }
    .test { height: 28px; padding: 0 12px; display: flex; align-items: center; background: var(--field); border-radius: 7px; font-size: 11.5px; color: var(--text); }
    .test__result { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ok); }
    .test__result i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
    .foot__spacer { flex: 1; }
    .save { height: 28px; padding: 0 16px; display: flex; align-items: center; background: var(--accent); border-radius: 7px; font-size: 11.5px; font-weight: 600; color: #fff; }
  </style>
</head>
<body>
  <div class="dialog">
    <div class="dialog__head">
      <div class="dialog__title">接入模型</div>
      <div class="dialog__close"><svg viewBox="0 0 10 10"><path d="M1.5 1.5 8.5 8.5M8.5 1.5 1.5 8.5"/></svg></div>
    </div>

    <div class="dialog__body">
      <div class="seg">
        <div class="seg__item seg__item--active">OpenAI 兼容</div>
        <div class="seg__item">Anthropic</div>
      </div>

      <div class="field">
        <div class="field__label">接口地址</div>
        <div class="field__input">https://api.deepseek.com/v1</div>
        <div class="presets">
          <div class="preset preset--active">DeepSeek</div>
          <div class="preset">智谱 GLM</div>
          <div class="preset">Kimi</div>
          <div class="preset">通义千问</div>
          <div class="preset">OpenAI</div>
          <div class="preset">Ollama</div>
        </div>
      </div>

      <div class="field">
        <div class="field__label">API 密钥</div>
        <div class="field__input">sk-••••••••••••••••••••••••</div>
      </div>

      <div class="field">
        <div class="field__label">模型名称</div>
        <div class="field__input">deepseek-chat</div>
      </div>
    </div>

    <div class="dialog__foot">
      <div class="test">测试连接</div>
      <div class="test__result"><i></i>连接成功</div>
      <div class="foot__spacer"></div>
      <div class="save">保存</div>
    </div>
  </div>
</body>
</html>
